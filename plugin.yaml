name: hermes-phoenix-otel
version: 0.2.0
description: Export LLM traces and spans to Phoenix (Arize) via OpenTelemetry
provides_hooks:
  - on_session_start
  - pre_llm_call
  - pre_api_request
  - post_api_request
  - pre_tool_call
  - post_tool_call
  - post_llm_call
  - on_session_end
  - on_session_finalize
  - on_session_reset
pip_dependencies:
  - arize-phoenix-otel
